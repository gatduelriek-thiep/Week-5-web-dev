<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>SpendWise</h2>
      <nav>
        <ul>
          <li><a href="#">Overview</a></li>
          <li><a href="#">Transactions</a></li>
          <li><a href="#">Reports</a></li>
          <li><a href="#">Settings</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main>
      <!-- Header -->
      <header class="header">
        <div class="user-info">
          <h1>Welcome to my spend wise Dashboard</h1>
        </div>
      </header>

      <!-- Cards -->
      <section class="cards">
        <div class="card" tabindex="0">Food: $250</div>
        <div class="card" tabindex="0">Transport: $120</div>
        <div class="card" tabindex="0">Rent: $500</div>
        <div class="card" tabindex="0">Entertainment: $80</div>
        <div class="card" tabindex="0">Savings: $300</div>
        <div class="card" tabindex="0">Utilities: $150</div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
